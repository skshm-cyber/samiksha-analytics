"""
Alembic configuration for database migrations.

This file configures Alembic to work with our async SQLAlchemy setup.
Run migrations with:
    alembic upgrade head    — apply all migrations
    alembic revision --autogenerate -m "description" — generate new migration
"""

from logging.config import fileConfig
from sqlalchemy import engine_from_config, pool
from alembic import context
import os
import sys

# Add the backend directory to the path so we can import our models
sys.path.insert(0, os.path.dirname(os.path.dirname(__file__)))

from app.database.connection import Base
from app.models import *  # noqa: import all models so Alembic sees them

config = context.config

# Set the database URL from environment variable
DATABASE_URL = os.getenv("DATABASE_URL", "")
if DATABASE_URL:
    # Alembic needs a sync driver, so convert asyncpg to psycopg2
    config.set_main_option("sqlalchemy.url", DATABASE_URL.replace("+asyncpg", ""))

if config.config_file_name is not None:
    fileConfig(config.config_file_name)

target_metadata = Base.metadata


def run_migrations_offline() -> None:
    """Run migrations in 'offline' mode — generates SQL without connecting."""
    url = config.get_main_option("sqlalchemy.url")
    context.configure(
        url=url,
        target_metadata=target_metadata,
        literal_binds=True,
        dialect_opts={"paramstyle": "named"},
    )
    with context.begin_transaction():
        context.run_migrations()


def run_migrations_online() -> None:
    """Run migrations in 'online' mode — connects to the database."""
    connectable = engine_from_config(
        config.get_section(config.config_ini_section, {}),
        prefix="sqlalchemy.",
        poolclass=pool.NullPool,
    )
    with connectable.connect() as connection:
        context.configure(connection=connection, target_metadata=target_metadata)
        with context.begin_transaction():
            context.run_migrations()


if context.is_offline_mode():
    run_migrations_offline()
else:
    run_migrations_online()
